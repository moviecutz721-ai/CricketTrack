/* ---------------- DAILY IQ ---------------- */

@Composable
fun DailyIQDialog(
    onDismiss: () -> Unit
) {
    var selected by remember { mutableStateOf(-1) }
    var submitted by remember { mutableStateOf(false) }

    val options = listOf(
        "Take a controlled scoring option",
        "Hit every ball for six",
        "Ignore the match situation",
        "Stop taking singles"
    )

    AlertDialog(
        onDismissRequest = onDismiss,
        title = {
            Text(
                "🧠 Daily Cricket IQ",
                fontWeight = FontWeight.Bold
            )
        },
        text = {
            Column {
                Text(
                    "Your team needs 12 runs from the last over. What should a smart batter focus on?",
                    fontWeight = FontWeight.SemiBold
                )

                Spacer(Modifier.height(12.dp))

                options.forEachIndexed { index, option ->
                    Row(
                        Modifier
                            .fillMaxWidth()
                            .clickable {
                                if (!submitted) selected = index
                            }
                            .padding(vertical = 5.dp),
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        RadioButton(
                            selected = selected == index,
                            onClick = {
                                if (!submitted) selected = index
                            }
                        )

                        Text(option)
                    }
                }

                if (submitted) {
                    Spacer(Modifier.height(10.dp))

                    Text(
                        if (selected == 0)
                            "Correct! 🎉 Match situation and controlled shot selection matter."
                        else
                            "Keep learning! Think about the match situation and scoring options.",
                        fontWeight = FontWeight.Medium
                    )
                }
            }
        },
        confirmButton = {
            Button(
                onClick = {
                    if (selected >= 0) submitted = true
                }
            ) {
                Text(if (submitted) "Done" else "Submit")
            }
        },
        dismissButton = {
            TextButton(onClick = onDismiss) {
                Text("Close")
            }
        }
    )
}

/* ---------------- NOTES ---------------- */

@Composable
fun NotesDialog(
    onDismiss: () -> Unit
) {
    var note by remember { mutableStateOf("") }
    var saved by remember { mutableStateOf(false) }

    AlertDialog(
        onDismissRequest = onDismiss,
        title = {
            Text(
                "📝 Today's Journal",
                fontWeight = FontWeight.Bold
            )
        },
        text = {
            Column {
                Text(
                    "23 September 2026",
                    color = Muted,
                    fontSize = 13.sp
                )

                Spacer(Modifier.height(12.dp))

                OutlinedTextField(
                    value = note,
                    onValueChange = {
                        note = it
                        saved = false
                    },
                    modifier = Modifier
                        .fillMaxWidth()
                        .height(150.dp),
                    placeholder = {
                        Text("What did you practice today?")
                    },
                    maxLines = 6
                )

                if (saved) {
                    Spacer(Modifier.height(8.dp))

                    Text(
                        "✓ Note saved for today",
                        color = Green,
                        fontWeight = FontWeight.Bold
                    )
                }
            }
        },
        confirmButton = {
            Button(
                onClick = {
                    if (note.isNotBlank()) {
                        saved = true
                    }
                },
                colors = ButtonDefaults.buttonColors(
                    containerColor = Green
                )
            ) {
                Text(if (saved) "Saved" else "Save Note")
            }
        },
        dismissButton = {
            TextButton(onClick = onDismiss) {
                Text("Close")
            }
        }
    )
}

