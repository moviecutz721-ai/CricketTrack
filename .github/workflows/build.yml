            }
        }
    }
}

/* ---------------- TRAINING ---------------- */

@Composable
fun TrainingScreen(modifier: Modifier = Modifier) {

    var completed by remember {
        mutableStateOf(setOf<Int>())
    }

    val training = listOf(
        "🏃" to "Warm-up & Mobility",
        "💪" to "Fitness & Strength",
        "🏏" to "Batting Practice",
        "🎯" to "Bowling Practice",
        "🧤" to "Fielding Practice",
        "🧠" to "Mental Training",
        "🧘" to "Recovery & Stretching",
        "💧" to "Hydration & Recovery"
    )

    LazyColumn(
        modifier = modifier
            .fillMaxSize()
            .padding(20.dp),
        verticalArrangement = Arrangement.spacedBy(12.dp)
    ) {
        item {
            Text(
                "Training",
                fontSize = 30.sp,
                fontWeight = FontWeight.ExtraBold,
                color = Navy
            )

            Text(
                "Build your game, one session at a time.",
                color = Muted
            )

            Spacer(Modifier.height(8.dp))

            Card(
                shape = RoundedCornerShape(20.dp),
                colors = CardDefaults.cardColors(
                    containerColor = Green
                )
            ) {
                Row(
                    Modifier
                        .fillMaxWidth()
                        .padding(18.dp),
                    horizontalArrangement = Arrangement.SpaceBetween
                ) {
                    Column {
                        Text(
                            "TODAY",
                            color = Lime,
                            fontWeight = FontWeight.Bold,
                            fontSize = 12.sp
                        )

                        Text(
                            "${completed.size} / ${training.size} completed",
                            color = Color.White,
                            fontSize = 21.sp,
                            fontWeight = FontWeight.Bold
                        )
                    }

                    Text(
                        "${(completed.size * 100) / training.size}%",
                        color = Color.White,
                        fontSize = 28.sp,
                        fontWeight = FontWeight.ExtraBold
                    )
                }
            }
        }

        items(training.indices.toList()) { index ->
            TrainingCheckItem(
                icon = training[index].first,
                title = training[index].second,
                checked = completed.contains(index),
                onChecked = {
                    completed =
                        if (completed.contains(index))
                            completed - index
                        else
                            completed + index
                }
            )
        }
    }
}

@Composable
fun TrainingCheckItem(
    icon: String,
    title: String,
    checked: Boolean,
    onChecked: () -> Unit
) {
    Card(
        modifier = Modifier
            .fillMaxWidth()
            .clickable { onChecked() },
        shape = RoundedCornerShape(18.dp)
    ) {
        Row(
            Modifier
                .fillMaxWidth()
                .padding(15.dp),
            verticalAlignment = Alignment.CenterVertically
        ) {
            Text(icon, fontSize = 24.sp)

            Spacer(Modifier.width(14.dp))

            Text(
                title,
                Modifier.weight(1f),
                fontWeight = FontWeight.SemiBold,
                color = Navy
            )

            Checkbox(
                checked = checked,
                onCheckedChange = { onChecked() }
            )
        }
    }
}

