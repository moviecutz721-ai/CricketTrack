class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        enableEdgeToEdge()
        setContent {
            CricketTrackTheme {
                CricketTrackApp()
            }
        }
    }
}

@Composable
fun CricketTrackApp() {
    var selectedTab by rememberSaveable { mutableIntStateOf(0) }

    Scaffold(
        bottomBar = {
            NavigationBar {
                NavigationBarItem(
                    selected = selectedTab == 0,
                    onClick = { selectedTab = 0 },
                    icon = { Icon(Icons.Default.Home, contentDescription = "Home") },
                    label = { Text("Home") }
                )
                NavigationBarItem(
                    selected = selectedTab == 1,
                    onClick = { selectedTab = 1 },
                    icon = { Icon(Icons.Default.SportsCricket, contentDescription = "Training") },
                    label = { Text("Training") }
                )
                NavigationBarItem(
                    selected = selectedTab == 2,
                    onClick = { selectedTab = 2 },
                    icon = { Icon(Icons.Default.EmojiEvents, contentDescription = "Progress") },
                    label = { Text("Progress") }
                )
                NavigationBarItem(
                    selected = selectedTab == 3,
                    onClick = { selectedTab = 3 },
                    icon = { Icon(Icons.Default.Person, contentDescription = "Profile") },
                    label = { Text("Profile") }
                )
            }
        }
    ) { padding ->
        when (selectedTab) {
            0 -> HomeScreen(modifier = Modifier.padding(padding))
            1 -> TrainingScreen(modifier = Modifier.padding(padding))
            2 -> ProgressScreen(modifier = Modifier.padding(padding))
            3 -> ProfileScreen(modifier = Modifier.padding(padding))
        }
    }
}

@Composable
fun HomeScreen(modifier: Modifier = Modifier) {
    var showIQ by remember { mutableStateOf(false) }

    var warmUpDone by rememberSaveable { mutableStateOf(true) }
    var battingDone by rememberSaveable { mutableStateOf(false) }
    var fieldingDone by rememberSaveable { mutableStateOf(false) }
    var fitnessDone by rememberSaveable { mutableStateOf(false) }

    LazyColumn(
        modifier = modifier
            .fillMaxSize()
            .padding(horizontal = 18.dp),
        verticalArrangement = Arrangement.spacedBy(16.dp)
    ) {
        item {
            Spacer(modifier = Modifier.height(10.dp))
            Row(
                modifier = Modifier.fillMaxWidth(),
                horizontalArrangement = Arrangement.SpaceBetween,
                verticalAlignment = Alignment.CenterVertically
            ) {
                Column {
                    Text("Good Morning 👋", fontSize = 15.sp, color = Color.Gray)
                    Text("Cricket Player", fontSize = 27.sp, fontWeight = FontWeight.Bold)
                }
                Surface(
                    modifier = Modifier.size(52.dp),
                    shape = RoundedCornerShape(18.dp),
                    color = MaterialTheme.colorScheme.primaryContainer
                ) {
                    Box(contentAlignment = Alignment.Center) {
                        Icon(Icons.Default.Person, contentDescription = "Profile", modifier = Modifier.size(30.dp))
                    }
                }
            }
        }

        item {
            Card(
                modifier = Modifier.fillMaxWidth(),
                shape = RoundedCornerShape(24.dp),
                colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.primary)
            ) {
                Column(modifier = Modifier.padding(20.dp)) {
                    Text("Today's Progress", color = Color.White, fontSize = 16.sp)
                    Spacer(modifier = Modifier.height(8.dp))
                    Text("65%", color = Color.White, fontSize = 34.sp, fontWeight = FontWeight.Bold)
                    Spacer(modifier = Modifier.height(10.dp))
                    LinearProgressIndicator(
                        progress = { 0.65f },
                        modifier = Modifier.fillMaxWidth(),
                        color = Color.White,
                        trackColor = Color.White.copy(alpha = 0.3f)
                    )
                    Spacer(modifier = Modifier.height(8.dp))
                    Text("Keep going. Your consistency matters!", color = Color.White.copy(alpha = 0.9f))
                }
            }
        }

        item {
            Row(
                modifier = Modifier.fillMaxWidth(),
                horizontalArrangement = Arrangement.spacedBy(12.dp)
            ) {
                StatCard(modifier = Modifier.weight(1f), icon = "🔥", value = "7", label = "Day Streak")
                StatCard(modifier = Modifier.weight(1f), icon = "⏱️", value = "6.2h", label = "This Week")
            }
        }

        item {
            Text("Today's Training", fontSize = 21.sp, fontWeight = FontWeight.Bold)
        }

        item { TrainingItem("🏃", "Warm-up & Mobility", warmUpDone) { warmUpDone = it } }
        item { TrainingItem("🏏", "Batting Practice", battingDone) { battingDone = it } }
        item { TrainingItem("🧤", "Fielding Practice", fieldingDone) { fieldingDone = it } }
        item { TrainingItem("💪", "Fitness & Strength", fitnessDone) { fitnessDone = it } }

        item {
            Card(
                modifier = Modifier
                    .fillMaxWidth()
                    .clickable { showIQ = true },
                shape = RoundedCornerShape(22.dp)
            ) {
                Column(modifier = Modifier.padding(20.dp)) {
                    Text("🧠 DAILY CRICKET IQ", fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                    Spacer(modifier = Modifier.height(8.dp))
                    Text("Test your cricket knowledge every day.", fontSize = 18.sp, fontWeight = FontWeight.SemiBold)
                    Spacer(modifier = Modifier.height(8.dp))
                    Text("Tap to answer today's question →", color = Color.Gray)
                }
            }
        }

        item {
            Card(
                modifier = Modifier.fillMaxWidth(),
                shape = RoundedCornerShape(22.dp)
            ) {
                Column(modifier = Modifier.padding(20.dp)) {
                    Text("📝 Daily Journal", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                    Spacer(modifier = Modifier.height(6.dp))
                    Text("Record what you practiced today.", color = Color.Gray)
                    Spacer(modifier = Modifier.height(14.dp))
                    Button(onClick = {}) {
                        Text("Add Today's Note")
                    }
                }
            }
        }

        item { Spacer(modifier = Modifier.height(20.dp)) }
    }

    if (showIQ) {
        DailyIQDialog(onDismiss = { showIQ = false })
    }
}

@Composable
fun StatCard(
    modifier: Modifier,
    icon: String,
    value: String,
    label: String
) {
    Card(
        modifier = modifier,
        shape = RoundedCornerShape(20.dp)
    ) {
        Column(modifier = Modifier.padding(16.dp)) {
            Text(icon, fontSize = 24.sp)
            Spacer(modifier = Modifier.height(5.dp))
            Text(value, fontSize = 22.sp, fontWeight = FontWeight.Bold)
            Text(label, color = Color.Gray, fontSize = 13.sp)
        }
    }
}

@Composable
fun TrainingItem(
    icon: String,
    title: String,
    checked: Boolean,
    onCheckedChange: (Boolean) -> Unit
) {
    Card(
        modifier = Modifier.fillMaxWidth(),
        shape = RoundedCornerShape(18.dp)
    ) {
        Row(
            modifier = Modifier
                .fillMaxWidth()
                .padding(15.dp),
            verticalAlignment = Alignment.CenterVertically
        ) {
            Text(text = icon, fontSize = 25.sp)
            Spacer(modifier = Modifier.width(14.dp))
            Text(text = title, modifier = Modifier.weight(1f), fontSize = 16.sp, fontWeight = FontWeight.Medium)
            Checkbox(checked = checked, onCheckedChange = onCheckedChange)
        }
    }
}

@Composable
fun DailyIQDialog(onDismiss: () -> Unit) {
    var selected by remember { mutableIntStateOf(-1) }
    var submitted by remember { mutableStateOf(false) }

    val options = listOf(
        "Play a defensive shot",
        "Take a risky big shot",
        "Leave the ball",
        "Run down the pitch"
    )

    AlertDialog(
        onDismissRequest = onDismiss,
        title = { Text("🧠 Daily Cricket IQ", fontWeight = FontWeight.Bold) },
        text = {
            Column {
                Text("Your team needs 12 runs from the last over. What should a smart batter focus on?", fontWeight = FontWeight.SemiBold)
                Spacer(modifier = Modifier.height(12.dp))
                options.forEachIndexed { index, option ->
                    Row(
                        modifier = Modifier
                            .fillMaxWidth()
                            .clickable { if (!submitted) selected = index }
                            .padding(vertical = 6.dp),
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        RadioButton(selected = selected == index, onClick = { if (!submitted) selected = index })
                        Spacer(modifier = Modifier.width(8.dp))
                        Text(option)
                    }
                }

                if (submitted) {
                    Spacer(modifier = Modifier.height(10.dp))
                    Text(
                        text = if (selected == 1) "Correct! 🎉 Smart shot selection can maximize the scoring opportunity."
                        else "Keep learning! Think about the match situation and scoring options.",
                        fontWeight = FontWeight.Medium
                    )
                }
            }
        },
        confirmButton = {
            Button(
                onClick = {
                    if (submitted) onDismiss() else if (selected >= 0) submitted = true
                }
            ) {
                Text(if (submitted) "Done" else "Submit")
            }
        },
        dismissButton = {
            TextButton(onClick = onDismiss) { Text("Close") }
        }
    )
}

@Composable
fun TrainingScreen(modifier: Modifier = Modifier) {
    val scrollState = rememberScrollState()
    Column(
        modifier = modifier
            .fillMaxSize()
            .verticalScroll(scrollState)
            .padding(20.dp)
    ) {
        Text("Training", fontSize = 30.sp, fontWeight = FontWeight.Bold)
        Text("Build your game every day.", color = Color.Gray)
        Spacer(modifier = Modifier.height(20.dp))

        listOf(
            "🏏" to "Batting Practice",
            "🎯" to "Bowling Practice",
            "🧤" to "Fielding Practice",
            "💪" to "Fitness & Strength",
            "🧠" to "Mental Training",
            "🧘" to "Recovery & Stretching"
        ).forEach { (icon, title) ->
            var done by rememberSaveable { mutableStateOf(false) }
            TrainingItem(icon, title, done) { done = it }
            Spacer(modifier = Modifier.height(10.dp))
        }
    }
}

