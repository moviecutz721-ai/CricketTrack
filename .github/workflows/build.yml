name: name: Build CricketTrack V2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Recreate CricketTrack V2 project
        env:
          CRICKETTRACK_ZIP_B64: |
            
        run: |
          echo "$CRICKETTRACK_ZIP_B64" | base64 -d > CricketTrackV2.zip
          echo "ZIP SHA256: 99878dde3a3ea7814bcd1cd74c04a7917f1eb7f22d11ae391ce33a50f565f879"
          unzip -q CricketTrackV2.zip -d build_project

            - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper
        working-directory: build_project
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Build debug APK
        working-directory: build_project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CricketTrack-V2-debug-APK
          path: build_project/app/build/outputs/apk/debug/app-debug.apk
